<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: Arial, Helvetica, sans-serif;
        }
        #toggle{
            display: none;
        }
        .card{
            position: relative;
            width: 300px;
            height: 260px;
            background-color: #111827;
            border-radius: 20px;
            overflow: hidden;
            color: white;
            text-align: center;
            padding-top: 40px;
            z-index: 1;
         animation: float 4s ease-in-out infinite;
        }
        .card::before{
            content: "";
            position: absolute;
            inset: -3px;     
            background: linear-gradient(45deg, #00f5ff, #ff00c8, #00f5ff);    
             background-size: 300%;    
              border-radius: 20px;    
               z-index: -1;      
            animation: borderMove 6s linear infinite;
        }
        .card::after {    
             content: "";     
             position: absolute;     
             inset: 3px;     
            background: #111827;    
         border-radius: 18px;    
          z-index: -1; 
        }
        h2{
            margin: 0;
            animation: glow 2s ease-in-out infinite alternate;
        }
        .button{
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(45deg, #00f5ff, #ff00c8);
            color: white;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .button:hover{
            transform: scale(1.1);
        }
        .ball{
            width: 50px;
            height: 50px;
            background-color: #00f5ff;
            border-radius: 50%;
            margin: 20px auto;
            opacity: 0;
        }
        #toggle:checked ~ .ball {    
             opacity: 1;     
            animation: bounce 1s infinite; 
        }
        @keyframes float{
            0%,100%{
                transform: translateY(0px);
            }
            50%{
                transform: translateY(-20px);
            }
        }
        @keyframes borderMove{
            0%{
                background-position: 0% 50%;
            }
            100%{
                background-position: 300% 50%;
            }
        }
        @keyframes glow{
            from{
                text-shadow: 0 0 5px #00f5ff, 0 0 10px #00f5ff;
            }
            to{
                text-shadow: 0 0 20px #ff00c8, 0 0 40px #ff00c8;
            }
        }
        @keyframes bounce{
            0%,100%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-100px);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Advanced Animation</h2>
        <p>This is a my Animation</p>
        <input type="checkbox" id="toggle">
        <label for="toggle" class="button">Click Me</label>
        <div class="ball">
        </div>
    </div>
</body>
</html>
